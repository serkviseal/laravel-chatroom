name: Deploy — Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-railway:
    name: Deploy to Railway (staging)
    runs-on: ubuntu-latest
    environment: staging
    # Runs only when CI passes on the same commit
    steps:
      - uses: actions/checkout@v4

      # ── Option A: Railway (recommended for new deployments) ────────────────
      # 1. Install Railway CLI and deploy
      # Requires: RAILWAY_TOKEN secret + RAILWAY_SERVICE_ID_STAGING secret
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway staging service
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID_STAGING }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # If RAILWAY_TOKEN is not set, this step is skipped gracefully
        continue-on-error: ${{ secrets.RAILWAY_TOKEN == '' }}

