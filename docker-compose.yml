services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [chatroom]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [chatroom]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: chatroom
      MYSQL_USER: chatroom
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [chatroom]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [chatroom]

  reverb:
    build:
      context: .
      target: dev
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [chatroom]

  horizon:
    build:
      context: .
      target: dev
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [chatroom]

  vite:
    build:
      context: .
      target: dev
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    networks: [chatroom]

networks:
  chatroom:

volumes:
  mysql_data:
  redis_data:
